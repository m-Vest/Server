name: deploy-all-services

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # application.yml 생성
      - name: Generate application.yml files
        run: |
          mkdir -p service/core/src/main/resources
          mkdir -p service/order/src/main/resources
          mkdir -p service/asset/src/main/resources

          echo "${{ secrets.CORE_APPLICATION }}" > service/core/src/main/resources/application.yml
          echo "${{ secrets.ORDER_APPLICATION }}" > service/order/src/main/resources/application.yml
          echo "${{ secrets.ASSET_APPLICATION }}" > service/asset/src/main/resources/application.yml

      # Service Build
      - name: Build services
        run: |
          ./gradlew :service:core:bootJar -x test
          ./gradlew :service:order:bootJar -x test
          ./gradlew :service:asset:bootJar -x test

      # 1. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. AWS ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Docker Image 빌드 및 ECR 푸시
      - name: Build, tag, and push images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # core 빌드 및 푸시
          docker build -t $ECR_REGISTRY/mvest-core:latest service/core
          docker push $ECR_REGISTRY/mvest-core:latest
          
          # order 빌드 및 푸시
          docker build -t $ECR_REGISTRY/mvest-order:latest service/order
          docker push $ECR_REGISTRY/mvest-order:latest
          
          # asset 빌드 및 푸시
          docker build -t $ECR_REGISTRY/mvest-asset:latest service/asset
          docker push $ECR_REGISTRY/mvest-asset:latest

      # 4. AWS에서 기존 태스크 정의(설계도) 다운로드 후 필요한 taskDefinition만 추출
      - name: Download active task definitions
        run: |
          aws ecs describe-task-definition --task-definition mvest-core-task --query taskDefinition > task-definition-core.json
          aws ecs describe-task-definition --task-definition mvest-order-task --query taskDefinition > task-definition-order.json
          aws ecs describe-task-definition --task-definition mvest-asset-task --query taskDefinition > task-definition-asset.json

      # 5. 다운로드한 설계도의 이미지 주소를 방금 만든 신규 이미지로 교체
      - name: Render Amazon ECS task definitions
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 이미지 주소 업데이트
          sed -i 's|"image": ".*mvest-core.*"|"image": "'"$REGISTRY"'/mvest-core:latest"|g' task-definition-core.json
          sed -i 's|"image": ".*mvest-order.*"|"image": "'"$REGISTRY"'/mvest-order:latest"|g' task-definition-order.json
          sed -i 's|"image": ".*mvest-asset.*"|"image": "'"$REGISTRY"'/mvest-asset:latest"|g' task-definition-asset.json
          
          # AWS 재등록 시 에러를 유발하는 읽기 전용 필드들 삭제
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition-core.json > temp-core.json && mv temp-core.json task-definition-core.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition-order.json > temp-order.json && mv temp-order.json task-definition-order.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition-asset.json > temp-asset.json && mv temp-asset.json task-definition-asset.json

      # 6. 새로 만들어진 json 설계도를 AWS에 정식 등록하고 롤링 배포 가동
      - name: Deploy Amazon ECS task definitions
        run: |
          # Core 배포
          aws ecs register-task-definition --cli-input-json file://task-definition-core.json
          aws ecs update-service --cluster mvest-cluster --service mvest-core-service --task-definition mvest-core-task --force-new-deployment
          
          # Order 배포
          aws ecs register-task-definition --cli-input-json file://task-definition-order.json
          aws ecs update-service --cluster mvest-cluster --service mvest-order-service --task-definition mvest-order-task --force-new-deployment
          
          # Asset 배포
          aws ecs register-task-definition --cli-input-json file://task-definition-asset.json
          aws ecs update-service --cluster mvest-cluster --service mvest-asset-service --task-definition mvest-asset-task --force-new-deployment